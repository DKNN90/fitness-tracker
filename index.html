<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>45-Minute Fitness</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{--bg:#f6f7f8;--card:#fff;--ink:#14202b;--mute:#5d6b78;--line:#e1e5e9;--acc:#0f766e;--acc2:#d1fae5;--bad:#b42318;--badbg:#fee4e2;--warn:#b54708;--warnbg:#fef0c7;--ok:#067647;--okbg:#d1fadf;--grey:#eceff2}
@media(prefers-color-scheme:dark){:root{--bg:#10171d;--card:#18222b;--ink:#eaf0f4;--mute:#9aa9b6;--line:#2a3743;--acc:#2dd4bf;--acc2:#12403b;--bad:#fda29b;--badbg:#4a1d1a;--warn:#fec84b;--warnbg:#463211;--ok:#75e0a7;--okbg:#0f3a24;--grey:#202b34}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 8px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0}
#sync{font-size:12px;color:var(--mute)}
main{padding:12px 14px;max-width:640px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:10px 2px 9px;font-size:12px;font-weight:600}
nav button.on{color:var(--acc)}
nav button span{display:block;font-size:19px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 4px;font-size:18px}
.card h3{margin:0 0 6px;font-size:15px}
.mute{color:var(--mute);font-size:14px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--grey);color:var(--mute);margin-right:4px}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.acc{background:var(--acc2);color:var(--acc)}
.banner{border-radius:12px;padding:11px 13px;margin-bottom:12px;font-size:14px}
.banner.warn{background:var(--warnbg);color:var(--warn)}.banner.bad{background:var(--badbg);color:var(--bad)}.banner.acc{background:var(--acc2);color:var(--acc)}
.btn{display:inline-block;border:0;border-radius:12px;background:var(--acc);color:#fff;font-weight:700;font-size:15px;padding:12px 16px;min-height:44px}
body.dark .btn{color:#042f2a}
@media(prefers-color-scheme:dark){.btn{color:#042f2a}}
.btn.sec{background:var(--grey);color:var(--ink)}.btn.bad{background:var(--badbg);color:var(--bad)}
.btn.block{display:block;width:100%;text-align:center}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.ex{padding:10px 0;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:0}
.exn{font-weight:650}
.rxl{color:var(--mute);font-size:13px;margin:1px 0 6px}
.sets{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.set{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:var(--mute);font-weight:700;font-size:15px}
.set.on{background:var(--acc);border-color:var(--acc);color:#fff}
@media(prefers-color-scheme:dark){.set.on{color:#042f2a}}
input[type=number],input[type=date],select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:44px}
input.w{width:92px}
.lbl{font-size:12px;color:var(--mute);margin-left:auto;text-align:right}
.blk{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--acc);margin:12px 0 2px}
.timer{text-align:center;padding:10px 0}
.tbig{font-size:56px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.tph{font-size:20px;font-weight:800}
.tph.hard{color:var(--bad)}.tph.easy{color:var(--ok)}
.wkrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line);gap:8px}
.wkrow:first-child{border-top:0}
.sess{display:inline-block;margin:3px 4px 0 0;padding:7px 10px;border-radius:10px;background:var(--grey);font-size:13px;font-weight:700;border:0;color:var(--ink)}
.sess.done{background:var(--okbg);color:var(--ok)}.sess.miss{background:var(--badbg);color:var(--bad)}.sess.opt{opacity:.75}.sess.today{outline:2px solid var(--acc)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:11px;color:var(--mute);text-align:center}
.cd{aspect-ratio:1;border-radius:9px;background:var(--grey);border:0;font-size:12px;color:var(--ink);padding:0;position:relative}
.cd.e{background:none}.cd.brk{background:repeating-linear-gradient(45deg,var(--grey),var(--grey) 4px,transparent 4px,transparent 8px);color:var(--mute)}
.cd.done{background:var(--ok);color:#fff}.cd.sch{outline:2px solid var(--acc);background:var(--card)}.cd.miss{background:var(--badbg);color:var(--bad)}.cd.pz{background:repeating-linear-gradient(45deg,var(--warnbg),var(--warnbg) 4px,transparent 4px,transparent 8px)}
.cd.today{box-shadow:0 0 0 2px var(--ink)}
.cd small{position:absolute;bottom:2px;left:0;right:0;font-size:9px;font-weight:800}
.bars{display:flex;gap:4px;align-items:flex-end;height:70px}
.bar{flex:1;background:var(--grey);border-radius:4px;position:relative;min-width:6px}
.bar i{position:absolute;bottom:0;left:0;right:0;background:var(--acc);border-radius:4px}
.stat{flex:1;min-width:90px;text-align:center;padding:10px 4px;background:var(--grey);border-radius:12px}
.stat b{display:block;font-size:24px}
.stat span{font-size:12px;color:var(--mute)}
details summary{font-weight:700;padding:8px 0;cursor:pointer}
ul{margin:6px 0 6px 18px;padding:0}li{margin:3px 0}
.back{background:none;border:0;color:var(--acc);font-weight:700;font-size:15px;padding:6px 0;margin-bottom:6px}
</style>
</head>
<body>
<header><h1>45-Minute Fitness</h1><span id="sync"></span></header>
<main id="app"></main>
<nav id="nav"></nav>
<script>
//CORE_START
const START='2026-11-09';
const PLAN_START='2026-11-11';
const BREAKS=[['2026-11-14','2026-11-23'],['2026-12-02','2026-12-06'],['2026-12-25','2026-12-27'],['2027-04-24','2027-05-01']];
const DAYMS=86400000;
function pd(s){const a=s.split('-').map(Number);return Date.UTC(a[0],a[1]-1,a[2]);}
function fd(ms){return new Date(ms).toISOString().slice(0,10);}
function addDays(s,n){return fd(pd(s)+n*DAYMS);}
function dow(s){return new Date(pd(s)).getUTCDay();}
function isBreak(s){return BREAKS.some(function(b){return s>=b[0]&&s<=b[1];});}
function isPaused(s,pauses){return (pauses||[]).some(function(p){return s>=p.from&&(p.to==null||s<=p.to);});}

const W={};
function wk(n,o){W[n]=Object.assign({n:n,sets:3,reps:'8-10',rpe:7,label:'Build',int:[[8,45,75]]},o);}
wk(1,{label:'Baseline',reps:'12',rpe:6,int:[[8,40,80]],order:['A','B'],note:'Record your starting weights. Start each lift at 5 kg and rate how it felt.'});
wk(2,{label:'Re-entry',reps:'12',rpe:6,int:[[8,40,80]],order:['A','B','I'],test:'base',note:'Back after 10 days off: start at Week 1 weights or about 10% lighter. Do the 5-minute bike test in your interval session.'});
wk(3,{reps:'12',rpe:6,int:[[8,40,80]],order:['A','I']});
wk(4,{reps:'10',note:'Back after a break: start at about 90% of your last loads, then progress.'});
wk(5,{reps:'10',int:[[9,45,75]]});
wk(6,{label:'Hold',reps:'10',order:['A','I','B'],note:'Festive week: keep loads steady and finish feeling fresh.'});
wk(7,{int:[[10,45,75]],note:'Start at Week 5 loads (just back from a break). Decide whether you are ready to unlock pressing (More tab).'});
wk(8,{int:[[10,45,75]],note:'Pressing only starts once you unlock it (More tab).'});
wk(9,{int:[[10,45,75]]});
wk(10,{int:[[10,45,75]]});
wk(11,{label:'Easy week',sets:2,rpe:6,int:[[6,45,75]],deload:true});
wk(12,{sets:4,int:[[8,60,60]]});
wk(13,{sets:4,int:[[9,60,60]]});
wk(14,{sets:4,int:[[10,60,60]]});
wk(15,{label:'Easy week',sets:2,rpe:6,int:[[6,60,60]],deload:true});
wk(16,{sets:4,reps:'6-8',rpe:8,int:[[5,180,120]]});
wk(17,{sets:4,reps:'6-8',rpe:8,int:[[5,180,120]]});
wk(18,{sets:4,reps:'6-8',rpe:8,int:[[5,180,120]]});
wk(19,{label:'Easy week',sets:2,reps:'6-8',rpe:6,int:[[3,180,120]],deload:true});
[20,21,22].forEach(function(n){wk(n,{label:'Peak block',mains:true,mainSets:4,mainReps:'5',mainRpe:8,int:[[5,180,120],[15,30,30]]});});
wk(23,{label:'Peak week',mains:true,mainSets:4,mainReps:'5',mainRpe:8,int:[[5,180,120],[15,30,30]],note:'Hardest week of the plan. Stop any set at the first sign of form breakdown.'});
wk(24,{label:'Return',int:[[5,180,120]],note:'Back from your break: start at about 90% of your last weights. This is your last week before testing.'});
wk(25,{label:'Test week',order:['T1','T2'],int:[],note:'Estimated tests only, never true maxes. Repeat the same bike test as Week 1.'});

function stageFor(date,clearedOn,planWeek){
  if(!clearedOn||date<clearedOn)return -1;
  var w=Math.floor((pd(date)-pd(clearedOn))/(7*DAYMS));
  var s=w<=0?0:w===1?1:w<=3?2:w<=5?3:4;
  var cap=planWeek>=16?4:planWeek>=12?3:2;
  if(planWeek<8)cap=-1;
  return Math.min(s,cap);
}
function ex(id,name,o){return Object.assign({id:id,name:name,w:true},o||{});}
function rx(it,cfg){
  var sets=cfg.sets,reps=cfg.reps,rpe=cfg.rpe,rest='45-60 s';
  if(cfg.mains&&it.main){sets=cfg.mainSets;reps=cfg.mainReps;rpe=cfg.mainRpe;rest='2 min';}
  else if(cfg.mains){sets=3;reps='8-10';rpe=7;}
  if(it.acc){sets=Math.min(sets,3);reps='10-12';}
  if(it.cap3)sets=Math.min(sets,3);
  if(it.sets!=null)sets=it.sets;
  if(it.reps)reps=it.reps;
  if(it.rpe)rpe=it.rpe;
  if(it.rest)rest=it.rest;
  var o=Object.assign({},it);o.sets=sets;o.reps=reps;o.rpe=rpe;o.rest=rest;return o;
}
function pressItems(type,stage,cfg){
  var p=null;
  if(type==='A'){
    if(stage===0)p=ex('ngpress','Neutral-grip dumbbell press (trial)',{press:true,sets:2,reps:'8',rpe:5,note:'Any pinch: stop. Pain must stay at 0-2/10 and settle within 24 hours.'});
    else if(stage===1)p=ex('ngpress','Neutral-grip dumbbell press',{press:true,sets:3,reps:'8-10',rpe:6});
    else if(stage===2||stage===3)p=ex('incpress','Incline dumbbell press',{press:true,cap3:true});
    else if(stage>=4)p=ex('flatdb','Flat dumbbell bench press',{press:true,cap3:true});
  }else{
    if(stage===1)p=ex('landmine','Landmine press',{press:true,sets:2,reps:'8',rpe:5,note:'First week: light and slow.'});
    else if(stage>=2)p=ex('landmine','Landmine press',{press:true,cap3:true});
  }
  return p?rx(p,cfg):null;
}
function sessionFor(type,planWeek,date,clearedOn,intervalIdx){
  var cfg=W[planWeek];if(!cfg)return null;
  var stage=stageFor(date,clearedOn,planWeek);
  var warm='Warm-up (4 min): easy cardio, then hips, thoracic spine and ankles mobility.';
  var s={type:type,planWeek:planWeek,note:cfg.note||'',warm:warm,blocks:[],stage:stage};
  var R=function(it){return rx(it,cfg);};
  if(type==='A'){
    s.title='Strength A';s.sub='Legs, hinge and pulling';
    var press=pressItems('A',stage,cfg);
    s.blocks=[
      {label:'Superset 1',items:[R(ex('legpress','Leg press',{main:false})),R(ex('seatedrow','Seated cable row'))]},
      {label:'Superset 2',items:[R(ex('rdl','Romanian deadlift',{main:true})),R(ex('ngpulldown','Neutral-grip lat pulldown',{main:true}))]},
      {label:'Superset 3',items:[R(ex('lunge','Walking lunges',{cap3:true})),press||R(ex('facepull','Face pull (light, skip if painful)',{acc:true}))]},
      {label:'Finisher',items:[R(ex('core','Dead bug + side plank',{w:false,sets:2,reps:'8 each side / 30 s',rest:'30 s',rpe:0}))]},
      {label:'Easy cardio (15 min)',items:[ex('cardio','Easy cardio: bike, incline walk or cross-trainer',{unit:'min',sets:1,reps:'15',rpe:4,rest:'',note:'Comfortable pace, you can speak in full sentences.'})]}
    ];
  }else if(type==='B'){
    s.title='Strength B';s.sub='Legs, glutes and pulling';
    var pr=pressItems('B',stage,cfg);
    var fin=[R(ex('carry','Suitcase carry (light, skip if it hurts)',{sets:2,reps:'30 m each side',rest:'30 s',rpe:0}))];
    if(stage>=3)fin.unshift(R(ex('inclinepushup','Incline push-up',{w:false,press:true,sets:2,reps:'8-12',rpe:7,rest:'45 s'})));
    s.blocks=[
      {label:'Superset 1',items:[R(ex('goblet','Goblet squat')),R(ex('dbrow','Single-arm dumbbell row'))]},
      {label:'Superset 2',items:[R(ex('hipthrust','Hip thrust',{main:true})),R(ex('csrow','Chest-supported row',{main:true}))]},
      {label:'Superset 3',items:[R(ex('stepup','Step-ups',{cap3:true})),pr||R(ex('reardelt','Rear-delt fly (light)',{acc:true}))]},
      {label:'Finisher',items:fin},
      {label:'Easy cardio (15 min)',items:[ex('cardio','Easy cardio: bike, incline walk or cross-trainer',{unit:'min',sets:1,reps:'15',rpe:4,rest:'',note:'Comfortable pace, you can speak in full sentences.'})]}
    ];
  }else if(type==='I'){
    var list=cfg.int||[[8,45,75]];var sp=list[Math.min(intervalIdx||0,list.length-1)];
    var warmM=sp[1]>=180?3:5,coolM=15;
    var total=Math.round(warmM+coolM+sp[0]*(sp[1]+sp[2])/60);
    s.title='Intervals';s.sub=sp[0]+' x '+fmtSec(sp[1])+' hard / '+fmtSec(sp[2])+' easy';
    s.interval={rounds:sp[0],hard:sp[1],easy:sp[2],warm:warmM,cool:coolM,total:total};
    s.blocks=[];
    if(cfg.test==='base'&&(intervalIdx||0)===0)s.blocks.push({label:'Baseline test (before the intervals)',items:[ex('bike5','5-minute max-distance bike effort',{unit:'km',sets:1,reps:'1',rpe:9,rest:'5 min easy'})]});
    s.hint='Bike is easiest on the joints (or incline walk). Hard = RPE 8-9, easy = RPE 3. The 15-minute cool-down is easy cardio at RPE 4. Legs sore from yesterday? Keep the full time but ride at RPE 7.';
  }else if(type==='Z'){
    s.title='Zone 2 (optional)';s.sub='30-45 min easy';
    s.blocks=[{label:'Easy aerobic work',items:[ex('z2min','Minutes completed',{unit:'min',sets:1,reps:'30-45',rpe:3,rest:''})]}];
    s.hint='Bike, brisk walk or jog at a pace where you can speak in full sentences. This builds your aerobic base.';
    s.optional=true;
  }else if(type==='T1'){
    s.title='Strength test';s.sub='Estimated 5-rep weights (not maxes)';
    var it=[ex('legpress','Leg press',{sets:1,reps:'5',rpe:8}),ex('rdl','Romanian deadlift',{sets:1,reps:'5',rpe:8}),ex('ngpulldown','Neutral-grip lat pulldown',{sets:1,reps:'5',rpe:8})];
    if(stage>=2)it.push(ex('incpress','Incline dumbbell press',{sets:1,reps:'8-10',rpe:7,press:true}));
    s.blocks=[{label:'Work up, then one set each at the target effort (RPE 8, 2 reps left). Record the weight.',items:it.map(function(x){x.rest='3 min';return x;})}];
  }else if(type==='T2'){
    s.title='Bike test';s.sub='Same 5-minute test as Week 1';
    s.blocks=[{label:'After a 5-minute warm-up',items:[ex('bike5','5-minute max-distance bike effort',{unit:'km',sets:1,reps:'1',rpe:9,rest:''})]}];
  }
  return s;
}
function fmtSec(s){return s>=60&&s%60===0?(s/60)+' min':s+' s';}

function buildSchedule(pauses){
  var weeks=[],byDate={},plan=1,mon=START;
  for(var i=0;i<80;i++){
    var days=[];for(var k=0;k<7;k++)days.push(addDays(mon,k));
    var avail=days.filter(function(d){return d>=PLAN_START&&!isBreak(d)&&!isPaused(d,pauses);});
    var CORE=[1,3,4,6];
    var slots=avail.filter(function(d){return CORE.indexOf(dow(d))>=0;});
    var slotsNoPause=days.filter(function(d){return d>=PLAN_START&&!isBreak(d)&&CORE.indexOf(dow(d))>=0;});
    var w={mon:mon,days:days,avail:avail,sessions:[],planWeek:null,status:'off'};
    if(plan<=25&&(slots.length>=2||(slots.length===1&&slotsNoPause.length===1))){
      w.planWeek=plan;w.status='train';
      var cfg=W[plan];var order=cfg.order||['A','I','B','I'];var ic=0;
      order.forEach(function(t,k){
        if(slots[k]){var o={date:slots[k],type:t,planWeek:plan};if(t==='I'){o.ii=ic;}if(t==='I')ic++;w.sessions.push(o);}
        else if(t==='I')ic++;
      });
      var sun=avail.filter(function(d){return dow(d)===0;})[0];
      if(sun&&plan!==25)w.sessions.push({date:sun,type:'Z',planWeek:plan,optional:true});
      plan++;
    }else if(plan>25)w.status='done';
    else w.status=slots.length?'light':'break';
    w.sessions.forEach(function(s){byDate[s.date]=s;});
    weeks.push(w);mon=addDays(mon,7);
    if(plan>25&&w.status==='done')break;
  }
  return {weeks:weeks,byDate:byDate};
}

var PROG={
 legpress:{s:5,p:.05},rdl:{s:2.5,p:.05},hipthrust:{s:5,p:.05},
 seatedrow:{s:2.5,p:.05},ngpulldown:{s:2.5,p:.05},csrow:{s:2.5,p:.05},facepull:{s:2.5,p:.05},
 goblet:{s:2,p:.05,u:'kg (one dumbbell)'},dbrow:{s:2,p:.05,u:'kg (one dumbbell)'},carry:{s:2,p:.05,u:'kg (one dumbbell)'},
 lunge:{s:2,p:.05,u:'kg each hand'},stepup:{s:2,p:.05,u:'kg each hand'},reardelt:{s:1,p:.05,u:'kg each hand'},
 ngpress:{s:2,p:.03,u:'kg each hand'},incpress:{s:2,p:.03,u:'kg each hand'},flatdb:{s:2,p:.03,u:'kg each hand'},landmine:{s:2.5,p:.03}
};
var DEMO={
 legpress:'leg press proper form tutorial',seatedrow:'seated cable row form tutorial',rdl:'romanian deadlift form tutorial',
 ngpulldown:'neutral grip lat pulldown form tutorial',lunge:'dumbbell walking lunge form tutorial',facepull:'cable face pull form tutorial',
 core:'dead bug and side plank exercise form',goblet:'goblet squat form tutorial',dbrow:'single arm dumbbell row form tutorial',
 hipthrust:'hip thrust form tutorial',csrow:'chest supported row form tutorial',stepup:'dumbbell step up form tutorial',
 reardelt:'rear delt fly form tutorial',carry:'suitcase carry form tutorial',ngpress:'neutral grip dumbbell press form tutorial',
 incpress:'incline dumbbell press form tutorial',landmine:'landmine press form tutorial',inclinepushup:'incline push up form tutorial',
 flatdb:'dumbbell bench press form tutorial',bike5:'5 minute max distance bike test how to',z2min:'zone 2 cardio explained how to',cardio:'zone 2 cardio explained how to'
};
var DEMO_INTERVAL='stationary bike interval workout how to';
function demoUrl(q){return 'https://www.youtube.com/results?search_query='+encodeURIComponent(q);}
function roundTo(x,s){return Math.round(x/s)*s;}
function nfmt(x){return String(Math.round(x*10)/10);}
function suggest(id,last,date,deload){
  var P=PROG[id];if(!P)return null;
  var L=last?Number(last.w):0;
  if(!last||!(L>0))return {kg:5,delta:null,text:'First time: start at 5 kg. It should feel easy, with 3 or more reps left.'};
  var step=P.s,gap=Math.round((pd(date)-pd(last.date))/DAYMS),kg,text;
  if(last.pain!=null&&last.pain>=3){kg=Math.max(step,roundTo(L*.9,step));text='Pain was 3 or more last time: drop to about 90%.';}
  else if(deload){kg=Math.max(step,roundTo(L*.9,step));text='Easy week: about 90% of your last weight.';}
  else if(gap>21){kg=Math.max(step,roundTo(L*.8,step));text='Back after '+gap+' days away: restart at about 80%.';}
  else if(gap>9){kg=Math.max(step,roundTo(L*.9,step));text='Back after a break: restart at about 90%.';}
  else if(last.fb==='h'){kg=last.full?L:Math.max(step,roundTo(L*.95,step));text=last.full?'Last time felt hard: repeat the same weight.':'Last time felt hard and incomplete: ease off slightly.';}
  else if(!last.full){kg=L;text='You did not tick every set last time: repeat the weight.';}
  else{
    var inc=Math.max(step,roundTo(L*P.p,step));
    if(last.fb==='e')inc=Math.max(step*2,roundTo(L*P.p*2,step));

function sparkline(vals){
  if(vals.length<2)return '';var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),w=280,hh=60,pad=6;
  var pts=vals.map(function(v,i){var x=pad+i*(w-2*pad)/(vals.length-1);var y=mx===mn?hh/2:hh-pad-(v-mn)*(hh-2*pad)/(mx-mn);return x.toFixed(1)+','+y.toFixed(1);});
  return '<svg viewBox="0 0 '+w+' '+hh+'" width="100%" height="'+hh+'" role="img" aria-label="Trend"><polyline fill="none" stroke="var(--acc)" stroke-width="3" stroke-linejoin="round" points="'+pts.join(' ')+'"/></svg>';
}
var EXN={legpress:'Leg press',seatedrow:'Seated cable row',rdl:'Romanian deadlift',ngpulldown:'Neutral-grip pulldown',lunge:'Walking lunges',facepull:'Face pull',carry:'Suitcase carry',goblet:'Goblet squat',dbrow:'Single-arm DB row',hipthrust:'Hip thrust',csrow:'Chest-supported row',stepup:'Step-ups',reardelt:'Rear-delt fly',ngpress:'Neutral-grip DB press',incpress:'Incline DB press',landmine:'Landmine press',inclinepushup:'Incline push-up',flatdb:'Flat DB bench',bike5:'5-min bike test (km)',z2min:'Zone 2 (minutes)',cardio:'Easy cardio (minutes)'};
var progEx='legpress';
function renderProgress(){
  var t=todayISO(),core=[],h='';
  sched.weeks.forEach(function(w){w.sessions.forEach(function(s){if(!s.optional)core.push(s);});});
  var due=core.filter(function(s){return s.date<=t;});var done=due.filter(function(s){return isDone(s.date);}).length;
  var allDone=core.filter(function(s){return isDone(s.date);}).length;
  var streak=0;
  var past=sched.weeks.filter(function(w){return w.status==='train'&&addDays(w.mon,6)<t;});
  for(var i=past.length-1;i>=0;i--){var cs=past[i].sessions.filter(function(s){return !s.optional;});if(cs.length&&cs.every(function(s){return isDone(s.date);}))streak++;else break;}
  var pct=due.length?Math.round(done*100/due.length):0;
  h+='<div class="card"><h2>Progress</h2><div class="row" style="margin-top:8px"><div class="stat"><b>'+done+'/'+due.length+'</b><span>sessions done so far</span></div><div class="stat"><b>'+pct+'%</b><span>adherence</span></div><div class="stat"><b>'+streak+'</b><span>full weeks in a row</span></div></div><div class="mute" style="margin-top:8px">'+allDone+' of '+core.length+' planned sessions completed overall.</div></div>';
  var tw=sched.weeks.filter(function(w){return w.status==='train';});
  var bars=tw.map(function(w){var cs=w.sessions.filter(function(s){return !s.optional;});var d=cs.filter(function(s){return isDone(s.date);}).length;var p=cs.length?d*100/cs.length:0;return '<div class="bar" title="Week '+w.planWeek+'"><i style="height:'+p+'%"></i></div>';}).join('');
  h+='<div class="card"><h3>Sessions done each week</h3><div class="bars">'+bars+'</div><div class="mute">Week 1 on the left, Week 25 on the right.</div></div>';
  var ids={};Object.keys(state.logs).forEach(function(d){var w=state.logs[d].w||{};Object.keys(w).forEach(function(k){if(w[k]!==''&&w[k]!=null)ids[k]=1;});});
  var keys=Object.keys(ids);
  h+='<div class="card"><h3>Weights and results</h3>';
  if(!keys.length)h+='<div class="mute">Enter a weight on any exercise and its trend appears here.</div>';
  else{
    if(keys.indexOf(progEx)<0)progEx=keys[0];
    h+='<select data-prog="1" style="width:100%">'+keys.map(function(k){return '<option value="'+k+'"'+(k===progEx?' selected':'')+'>'+esc(EXN[k]||k)+'</option>';}).join('')+'</select>';
    var ds=Object.keys(state.logs).filter(function(d){var v=state.logs[d].w&&state.logs[d].w[progEx];return v!==''&&v!=null&&!isNaN(Number(v));}).sort();
    var vals=ds.map(function(d){return Number(state.logs[d].w[progEx]);});
    h+='<div style="margin-top:8px">'+sparkline(vals)+'</div><div class="mute">First '+vals[0]+' → latest '+vals[vals.length-1]+(vals[0]?' ('+(vals[vals.length-1]>=vals[0]?'+':'')+Math.round((vals[vals.length-1]-vals[0])*100/vals[0])+'%)':'')+'</div>';
    h+='<div style="margin-top:6px">'+ds.slice(-6).reverse().map(function(d){return '<div class="row sp mute"><span>'+fdate(d)+'</span><b style="color:var(--ink)">'+esc(state.logs[d].w[progEx])+'</b></div>';}).join('')+'</div>';
  }
  h+='</div>';
  h+='<div class="card"><h3>Body measures</h3><div class="mute">Log monthly: resting heart rate (on waking), waist and bodyweight.</div><div class="row" style="margin-top:8px"><input class="w" type="number" inputmode="numeric" id="m_hr" placeholder="Rest HR"><input class="w" type="number" inputmode="decimal" id="m_wa" placeholder="Waist cm"><input class="w" type="number" inputmode="decimal" id="m_kg" placeholder="Weight kg"></div><div style="margin-top:8px"><button class="btn" data-act="meas">Save today</button></div>';
  h+=state.meas.slice(-5).reverse().map(function(m,i){return '<div class="row sp mute" style="margin-top:6px"><span>'+fdate(m.date)+'</span><span>HR '+esc(m.hr||'-')+' · waist '+esc(m.waist||'-')+' · '+esc(m.kg||'-')+' kg</span></div>';}).join('');
  h+='</div>';
  return h;
}
var OBJ=['Rate any set by RPE (effort) and reps in reserve, and explain why 2-3 reps left is the working zone.','Apply double progression unaided and log weight, reps and RPE every session.','State and follow the three back-off triggers: pain above 3/10, form breakdown, or RPE up 2 points at the same load.','Run the pressing lock: know the unlock criteria and run each new press as a one-week trial.','Hit the target in at least 80% of interval rounds, and explain what Zone 2 versus hard intervals train.','Outcome by May: bike distance up 5-8% from Week 1, estimated 5-rep weights up 15-20% on leg press and pulldown.'];
function renderMore(){
  var h=rpeGuide(true),op=state.pauses.filter(function(p){return p.to==null;})[0];
  h+='<div class="card"><h2>Pause the plan</h2><div class="mute">Pausing holds your place. When you resume, the next programme week starts on the next training day and your breaks stay on their fixed dates.</div>';
  if(op)h+='<div class="banner warn" style="margin-top:10px">Paused since '+fdate(op.from)+'</div><button class="btn block" data-act="resume">Resume today</button>';
  else h+='<div style="margin-top:10px"><button class="btn block" data-act="pausenow">Pause from today</button></div>';
  h+='<details style="margin-top:8px"><summary>Schedule a pause</summary><div class="row"><input type="date" id="p_from"><span class="mute">to</span><input type="date" id="p_to"></div><div style="margin-top:8px"><button class="btn sec" data-act="addpause">Add pause</button></div></details>';
  var closed=state.pauses.filter(function(p){return p.to!=null;});
  h+=closed.map(function(p,i){return '<div class="row sp" style="margin-top:6px"><span class="mute">'+fdate(p.from)+' to '+fdate(p.to)+'</span><button class="btn sec" data-act="rmpause" data-i="'+state.pauses.indexOf(p)+'">Remove</button></div>';}).join('');
  h+='</div>';
  h+='<div class="card"><h2>Pressing lock</h2>';
  if(state.clearedOn)h+='<div class="banner acc">Pressing unlocked from '+fdate(state.clearedOn)+'. It builds in steps: trial week, then landmine, incline, push-ups, flat bench.</div><button class="btn bad block" data-act="relock">Lock pressing again</button>';
  else h+='<div class="mute">Pressing exercises stay locked until you unlock them. Only unlock when you are cleared to push (if you have had an injury, check with a professional) and you have had two weeks of pain-free pulling (pain 0-2/10 that settles within 24 hours). Pressing is not unlocked before Week 8 (4 Jan).</div><button class="btn block" style="margin-top:10px" data-act="unlock">I meet both: unlock pressing today</button>';
  h+='</div>';

  var LN={legpress:'Leg press',rdl:'Romanian deadlift',hipthrust:'Hip thrust',seatedrow:'Seated cable row',ngpulldown:'Neutral-grip pulldown',csrow:'Chest-supported row',facepull:'Face pull',goblet:'Goblet squat',dbrow:'Single-arm DB row',lunge:'Walking lunges',stepup:'Step-ups',reardelt:'Rear-delt fly',carry:'Suitcase carry',ngpress:'Neutral-grip DB press',incpress:'Incline DB press',landmine:'Landmine press',flatdb:'Flat DB bench'};
  h+='<div class="card"><h2>Weight ladder from a 5 kg start</h2><div class="mute">What the app suggests week by week if you finish every set and rate it Right. Rate a lift Hard and the app holds the weight; rate it Easy and it takes a bigger jump. Dumbbell moves are per hand.</div><div style="margin-top:8px">'+Object.keys(LN).map(function(k){return '<div style="padding:6px 0;border-top:1px solid var(--line)"><b>'+LN[k]+'</b><div class="mute">'+ladder(k,8).map(nfmt).join(' → ')+'</div></div>';}).join('')+'</div><div class="mute" style="margin-top:8px">Steps are 5% (3% for presses), rounded to what your gym can load: 5 kg on leg press and hip thrust, 2.5 kg on cables and barbell hinges, 2 kg on dumbbells. After a break the app restarts you at 80-90%.</div></div>';
  h+='<div class="card"><h2>Rules that keep you progressing</h2><ul><li><b>Effort (RPE):</b> see the explanation at the top of this tab.</li><li><b>Progression:</b> when every set reaches the top of the rep range with 2-3 reps left, add 2.5-5% next time.</li><li><b>Back off if:</b> pain is 3/10 or more, form breaks down, or the same weight feels 2 RPE points harder.</li><li><b>After a break:</b> start at about 80-90% of your last weights.</li><li><b>Rest:</b> 45-60 s on accessories, 2 min on the heavy pairs.</li><li><b>Missed a week?</b> Repeat the last one, never jump ahead.</li></ul></div>';
  h+='<div class="card"><h2>Learning objectives</h2><div class="mute">By May you should be able to:</div><ul>'+OBJ.map(function(o){return '<li>'+esc(o)+'</li>';}).join('')+'</ul></div>';
  var standalone=!window.claude;
  h+='<div class="card"><h2>Calendar and reminders</h2><div class="mute">Download your upcoming sessions as a calendar file. Each one is 45 minutes with a reminder 30 minutes before, so your phone alerts you. Open the file and add it to Google Calendar. After you pause or resume, download it again.</div>';
  if(standalone)h+='<div class="row" style="margin-top:10px"><span class="mute">Session time</span><input type="time" id="c_time" value="'+esc(state.calTime||'18:00')+'" data-caltime="1" style="width:120px"></div><div style="margin-top:10px"><button class="btn block" data-act="ics">Download calendar file</button> <span id="icsmsg" class="mute"></span></div>';
  else h+='<div class="banner warn" style="margin-top:10px">Calendar download works in the installed app, not in this preview.</div>';
  h+='</div>';
  h+='<div class="card"><h2>Backup and restore</h2><div class="mute">Your data lives on this device'+(standalone?'':' and in your Claude account')+'. Copy a backup now and then, or paste one to restore.</div><div style="margin-top:10px"><button class="btn sec" data-act="backup">Copy backup of my data</button> <span id="bk" class="mute"></span></div><textarea id="rest" rows="3" placeholder="Paste a backup here to restore" style="width:100%;margin-top:10px"></textarea><div style="margin-top:8px"><button class="btn sec" data-act="restore">Restore from pasted backup</button> <span id="rs" class="mute"></span></div></div>';
  if(window.__installEvt)h+='<div class="card"><h2>Install</h2><button class="btn block" data-act="install">Install this app</button></div>';
  return h;
}
function render(){
  sched=buildSchedule(state.pauses);
  var app=document.getElementById('app');var t=ui.tab;
  app.innerHTML=t==='today'?renderToday():t==='plan'?renderPlan():t==='cal'?renderCal():t==='progress'?renderProgress():renderMore();
  document.getElementById('nav').innerHTML=[['today','🏋️','Today'],['plan','📋','Plan'],['cal','📅','Calendar'],['progress','📈','Progress'],['more','⚙️','More']].map(function(x){return '<button data-nav="'+x[0]+'" class="'+(t===x[0]?'on':'')+'"><span>'+x[1]+'</span>'+x[2]+'</button>';}).join('');
  if(t==='plan'&&!ui.scrolled){ui.scrolled=true;var c=document.getElementById('curwk');if(c)c.scrollIntoView({block:'center'});}
}
function act(a,d,el){
  var t=todayISO();
  if(a==='set'){var lg=ensureLog(d.d);lg.ck=lg.ck||{};var arr=lg.ck[d.e]||[];arr[+d.i]=!arr[+d.i];lg.ck[d.e]=arr;lg.n=lg.n||{};if(d.n)lg.n[d.e]=+d.n;save();render();}
  else if(a==='fb'){var lf=ensureLog(d.d);lf.fb=lf.fb||{};lf.fb[d.e]=lf.fb[d.e]===d.v?null:d.v;save();render();}
  else if(a==='use'){var lu=ensureLog(d.d);lu.w=lu.w||{};lu.w[d.e]=d.v;save();render();}
  else if(a==='done'){var l=ensureLog(d.d);l.done=true;l.skipped=false;l.doneAt=Date.now();save();render();}
  else if(a==='undone'){var l2=ensureLog(d.d);l2.done=false;save();render();}
  else if(a==='skip'){var l3=ensureLog(d.d);l3.skipped=true;l3.done=false;save();ui.date=null;render();}
  else if(a==='open'){ui.date=d.d;ui.tab='today';render();window.scrollTo(0,0);}
  else if(a==='back'){ui.date=null;render();}
  else if(a==='tstart'){
    try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.resume)actx.resume();}catch(e){}
    try{if(navigator.wakeLock)navigator.wakeLock.request('screen').catch(function(){});}catch(e){}
    var s=sessionAt(d.d);if(!s||!s.interval)return;if(!timer||timer.date!==d.d)timer=mkTimer(s.interval,d.d);
    timer.run=!timer.run;timer.last=Date.now();render();
  }
  else if(a==='tskip'){if(timer&&timer.i<timer.ph.length-1){timer.i++;timer.left=timer.ph[timer.i].sec;timer.last=Date.now();paintTimer();}}
  else if(a==='treset'){timer=null;render();}
  else if(a==='pausenow'){state.pauses.push({from:isDone(t)?addDays(t,1):t,to:null});save();ui.date=null;render();}
  else if(a==='resume'){state.pauses.forEach(function(p){if(p.to==null){var y=addDays(t,-1);if(y<p.from){p.to=p.from;p.dead=true;}else p.to=y;}});state.pauses=state.pauses.filter(function(p){return !p.dead;});save();render();}
  else if(a==='addpause'){var f=document.getElementById('p_from').value,to=document.getElementById('p_to').value;if(!f||!to||to<f)return;state.pauses.push({from:f,to:to});save();render();}
  else if(a==='rmpause'){state.pauses.splice(+d.i,1);save();render();}
  else if(a==='unlock'){state.clearedOn=t;save();render();}
  else if(a==='relock'){state.clearedOn=null;save();render();}
  else if(a==='meas'){var hr=document.getElementById('m_hr').value,wa=document.getElementById('m_wa').value,kg=document.getElementById('m_kg').value;if(!hr&&!wa&&!kg)return;state.meas.push({date:t,hr:hr,waist:wa,kg:kg});save();render();}
  else if(a==='ics'){makeIcs();}
  else if(a==='restore'){var ta=document.getElementById('rest'),rs=document.getElementById('rs');try{var o=JSON.parse(ta.value);if(!o||typeof o!=='object'||!o.logs)throw 0;state=normalize(o);state.updated=Date.now();localSave();queueDb();render();}catch(e){rs.textContent='That is not a valid backup';}}
  else if(a==='install'){var ev=window.__installEvt;if(ev){ev.prompt();window.__installEvt=null;setTimeout(render,500);}}
  else if(a==='backup'){var txt=JSON.stringify(state);var b=document.getElementById('bk');try{navigator.clipboard.writeText(txt).then(function(){b.textContent='Copied';},function(){b.textContent='Copy blocked here';});}catch(e){b.textContent='Copy blocked here';}}
}
document.addEventListener('click',function(e){
  var n=e.target.closest('[data-nav]');
  if(n){ui.tab=n.dataset.nav;if(ui.tab!=='today')ui.date=null;render();window.scrollTo(0,0);return;}
  var b=e.target.closest('[data-act]');if(b&&!b.disabled)act(b.dataset.act,b.dataset,b);
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.w){var lg=ensureLog(t.dataset.d);lg.w=lg.w||{};lg.w[t.dataset.w]=t.value;save();}
  else if(t.dataset&&t.dataset.pain){var l=ensureLog(t.dataset.pain);l.pain=t.value===''?null:Number(t.value);save();render();}
  else if(t.dataset&&t.dataset.prog){progEx=t.value;render();}
  else if(t.dataset&&t.dataset.caltime){state.calTime=t.value||'18:00';save();}
});

function icsEsc(x){return String(x).replace(/\\/g,'\\\\').replace(/;/g,'\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');}
function makeIcs(){
  var t=todayISO(),tm=(state.calTime||'18:00').split(':'),hh=parseInt(tm[0],10)||18,mm=parseInt(tm[1],10)||0;
  var pad=function(n){return String(n).padStart(2,'0');};
  var now=new Date();var stamp=now.getUTCFullYear()+pad(now.getUTCMonth()+1)+pad(now.getUTCDate())+'T'+pad(now.getUTCHours())+pad(now.getUTCMinutes())+pad(now.getUTCSeconds())+'Z';
  var lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//45-Minute Fitness//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH'];var n=0;
  sched.weeks.forEach(function(w){w.sessions.forEach(function(se){
    if(se.optional||se.date<t||isDone(se.date)||isSkipped(se.date))return;
    var s=sessionFor(se.type,se.planWeek,se.date,state.clearedOn,se.ii);if(!s)return;
    var d=se.date.replace(/-/g,'');var st=d+'T'+pad(hh)+pad(mm)+'00';var end=hh*60+mm+45;var et=d+'T'+pad(Math.floor(end/60)%24)+pad(end%60)+'00';
    lines.push('BEGIN:VEVENT','UID:fit45-'+se.date+'@fit45','DTSTAMP:'+stamp,'DTSTART:'+st,'DTEND:'+et,'SUMMARY:'+icsEsc(s.title+' (Week '+se.planWeek+')'),'DESCRIPTION:'+icsEsc((s.sub||'')+'. About 45 minutes. Open the 45-Minute Fitness app to log it.'),'BEGIN:VALARM','TRIGGER:-PT30M','ACTION:DISPLAY','DESCRIPTION:Workout in 30 minutes','END:VALARM','END:VEVENT');n++;
  });});
  lines.push('END:VCALENDAR');
  var msg=document.getElementById('icsmsg');
  if(!n){if(msg)msg.textContent='No upcoming sessions to add';return;}
  try{var b=new Blob([lines.join('\r\n')],{type:'text/calendar'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='fitness-sessions.ics';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);if(msg)msg.textContent=n+' sessions in the file';}
  catch(e){if(msg)msg.textContent='Download blocked here';}
}
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();window.__installEvt=e;if(ui.tab==='more')render();});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
render();initDb();
//UI_END
</script>
